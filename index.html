<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>晓笺藏竹影</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23b03a2e'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%23f4eee2' font-family='serif'>藏</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 访问口令门 -->
  <div id="gate" class="gate hidden">
    <div class="gate-box">
      <div class="seal-mark" aria-hidden="true">藏</div>
      <h1 class="gate-title">晓笺藏竹影</h1>
      <p class="subtitle">拂晓书笺 · 珍藏竹影</p>
      <input type="password" id="gate-password" class="input gate-input" placeholder="输入访问口令" autocomplete="off">
      <button class="btn btn-primary btn-block" id="gate-submit">进入</button>
      <p id="gate-error" class="hint hidden" style="color:var(--seal)">口令错误，请重试</p>
    </div>
  </div>

  <header class="site-header">
    <div class="seal-mark" aria-hidden="true">藏</div>
    <div class="title-block">
      <h1>晓笺藏竹影</h1>
      <p class="subtitle">拂晓书笺 · 珍藏竹影</p>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="notes">笔记</button>
    <button class="tab-btn" data-tab="handwriting">手写</button>
    <button class="tab-btn" data-tab="todos">待办</button>
    <button class="tab-btn" data-tab="ai">AI 整合</button>
    <button class="tab-btn" data-tab="settings">设置</button>
  </nav>

  <main>
    <!-- 手写 -->
    <section class="panel" id="panel-handwriting">
      <!-- 手写列表 -->
      <div id="hw-gallery">
        <div class="hw-toolbar">
          <button class="btn btn-primary" id="btn-hw-new">＋ 新建手写</button>
        </div>
        <div id="hw-list" class="hw-grid"></div>
      </div>

      <!-- 手写画布 -->
      <div id="hw-editor" class="hidden">
        <div class="hw-toolbar">
          <div class="hw-group">
            <span class="hw-label">颜色</span>
            <button class="hw-color active" data-color="#1a1a1a" style="background:#1a1a1a"></button>
            <button class="hw-color" data-color="#b03a2e" style="background:#b03a2e"></button>
            <button class="hw-color" data-color="#2e5a8a" style="background:#2e5a8a"></button>
            <button class="hw-color" data-color="#3a7a4a" style="background:#3a7a4a"></button>
            <button class="hw-color" data-color="#8a5a2b" style="background:#8a5a2b"></button>
            <button class="hw-color" data-color="#5a3a8a" style="background:#5a3a8a"></button>
          </div>
          <div class="hw-group">
            <span class="hw-label">粗细</span>
            <button class="hw-size active" data-size="2">细</button>
            <button class="hw-size" data-size="5">中</button>
            <button class="hw-size" data-size="9">粗</button>
          </div>
        </div>
        <div class="hw-toolbar">
          <button class="btn" id="hw-eraser">橡皮</button>
          <button class="btn" id="hw-undo">撤销</button>
          <button class="btn" id="hw-clear">清除</button>
          <button class="btn" id="hw-back">返回</button>
          <button class="btn" id="hw-save">保存</button>
          <button class="btn btn-primary" id="hw-recognize">✦ 识别</button>
        </div>
        <canvas id="hw-canvas"></canvas>
      </div>
    </section>

    <!-- 笔记 -->
    <section class="panel active" id="panel-notes">
      <div class="toolbar">
        <input type="search" id="note-search" class="input search" placeholder="搜索笔记…">
        <select id="note-category-filter" class="input select"></select>
        <details class="import-menu" id="import-menu">
          <summary class="btn">导入 ▾</summary>
          <div class="import-options">
            <button class="import-opt" data-import="document">📄 导入文档（Word/PDF/文本）</button>
            <button class="import-opt" data-import="ppt">📊 导入 PPT</button>
            <button class="import-opt" data-import="image">🖼 导入图片识别文字</button>
          </div>
        </details>
        <input type="file" id="note-file-input" accept=".txt,.md,.markdown,.text,.docx,.pdf,text/plain,text/markdown,application/pdf" class="hidden">
        <button class="btn" id="btn-export-pdf" title="导出全部笔记为 PDF">导出PDF</button>
        <button class="btn btn-primary" id="btn-new-note">＋ 新建</button>
      </div>
      <div id="note-list" class="list"></div>
      <div id="note-empty" class="empty hidden">暂无笔记，点右上角「新建」开始记录</div>
    </section>

    <!-- 待办 -->
    <section class="panel" id="panel-todos">
      <div class="toolbar">
        <input type="search" id="todo-search" class="input search" placeholder="搜索待办…">
        <select id="todo-filter" class="input select">
          <option value="all">全部</option>
          <option value="active">未完成</option>
          <option value="completed">已完成</option>
        </select>
        <button class="btn btn-primary" id="btn-new-todo">＋ 新建</button>
      </div>
      <div id="todo-list" class="list"></div>
      <div id="todo-empty" class="empty hidden">暂无待办</div>
    </section>

    <!-- AI 整合 -->
    <section class="panel" id="panel-ai">
      <div class="ai-card">
        <div class="field-group">
          <label class="field-label">笔记范围</label>
          <div class="seg" id="ai-mode">
            <button class="seg-btn active" data-mode="all">全部</button>
            <button class="seg-btn" data-mode="category">按分类</button>
            <button class="seg-btn" data-mode="manual">手动选择</button>
          </div>
        </div>

        <div class="field-group hidden" id="ai-category-group">
          <label class="field-label">选择分类</label>
          <select id="ai-category" class="input select"></select>
        </div>

        <div class="field-group hidden" id="ai-manual-group">
          <label class="field-label">勾选笔记（<span id="ai-manual-count">0</span> 篇）</label>
          <div id="ai-manual-list" class="check-list"></div>
        </div>

        <div class="field-group">
          <label class="field-label">保存到分类</label>
          <select id="ai-target-category" class="input select"></select>
        </div>

        <button class="btn btn-primary btn-block" id="btn-generate" disabled>✦ 生成专属笔记本</button>
        <p class="hint" id="ai-hint"></p>

        <div id="ai-result" class="ai-result hidden">
          <div class="ai-result-head">
            <span>整合结果</span>
            <button class="btn btn-primary" id="btn-save-result">保存为笔记</button>
          </div>
          <div id="ai-result-content" class="ai-result-content"></div>
        </div>
      </div>
    </section>

    <!-- 设置 -->
    <section class="panel" id="panel-settings">
      <div class="settings-card">
        <h2 class="card-title">AI 接口（OpenAI 兼容）</h2>
        <label class="field-label">API Key</label>
        <input type="password" id="set-apikey" class="input" placeholder="sk-…" autocomplete="off">
        <label class="field-label">Base URL</label>
        <input type="text" id="set-baseurl" class="input" placeholder="https://api.openai.com/v1">
        <label class="field-label">模型名称</label>
        <input type="text" id="set-model" class="input" placeholder="gpt-4o-mini">
        <label class="field-label">最大输出 Token</label>
        <input type="number" id="set-maxtokens" class="input" min="256" max="16384" step="256">
        <label class="field-label">系统提示词（可选）</label>
        <textarea id="set-prompt" class="input textarea" rows="3"></textarea>
        <button class="btn btn-primary btn-block" id="btn-save-settings">保存设置</button>
        <p class="hint" id="settings-hint"></p>

        <h2 class="card-title">精准识别（云端 OCR）</h2>
        <label class="check-item" style="margin-bottom:10px">
          <input type="checkbox" id="set-cloud-ocr">
          <span>启用云端手写识别（更精准）</span>
        </label>
        <label class="field-label">百度 OCR API Key</label>
        <input type="text" id="set-baidu-apikey" class="input" placeholder="百度智能云申请的 API Key" autocomplete="off">
        <label class="field-label">百度 OCR Secret Key</label>
        <input type="password" id="set-baidu-secret" class="input" placeholder="Secret Key" autocomplete="off">
        <p class="hint">启用后手写内容会发送到百度 OCR 识别，介意隐私可关闭。申请：cloud.baidu.com → 文字识别 → 手写文字识别</p>

        <h2 class="card-title">分类管理</h2>
        <div id="category-list" class="category-list"></div>
        <div class="category-add">
          <input type="text" id="new-category-name" class="input" placeholder="新分类名称">
          <button class="btn" id="btn-add-category">添加</button>
        </div>

        <h2 class="card-title">数据备份</h2>
        <div class="category-add">
          <button class="btn" id="btn-export">导出备份</button>
          <button class="btn" id="btn-import">导入备份</button>
          <input type="file" id="import-file" accept=".json,application/json" class="hidden">
        </div>
        <p class="hint">笔记数据存在本机浏览器，建议定期「导出备份」存一份，换设备或清缓存后可用「导入备份」恢复。</p>
      </div>
    </section>
  </main>

  <!-- 通用弹窗 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-box"></div>
  </div>

  <!-- 打印区域（PDF 导出用） -->
  <div id="print-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
